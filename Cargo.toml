[workspace]
resolver = "3"
members = [
    "crates/rookery-core",
    "crates/rookery-platform",
    "crates/rookery-render",
    "crates/rookery-bench",
    "host",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Daniel-A-C/Rookery"
authors = ["Daniel Carroll <danalexanderc@gmail.com>"]

[workspace.dependencies]
rookery-core = { path = "crates/rookery-core" }
rookery-platform = { path = "crates/rookery-platform" }
rookery-render = { path = "crates/rookery-render" }

anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
raw-window-handle = { version = "0.6", features = ["std"] }
wgpu = "30"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
tempfile = "3"
png = "0.18"
gif = "0.13"
base64 = "0.22"
toml = "0.8"
rodio = "0.23"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

