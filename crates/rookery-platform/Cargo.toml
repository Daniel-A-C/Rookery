[package]
name = "rookery-platform"
description = "Thin OS abstraction for Rookery: desktop wallpaper window attachment, window occlusion probe, and power-state probe."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
rookery-core.workspace = true
raw-window-handle.workspace = true
anyhow.workspace = true
log.workspace = true
serde.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder", "NSScreen", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSProcessInfo", "NSString"] }
objc2-core-foundation = { version = "0.3", features = ["CFArray", "CFCGTypes", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3", features = ["CGDirectDisplay", "CGDisplayConfiguration", "CGEvent", "CGEventTypes", "CGGeometry", "CGWindow", "CGWindowLevel"] }
objc2-io-kit = { version = "0.3", default-features = false, features = ["std", "ps"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Power",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
