[metadata]
id = "aurora-waves"
name = "Aurora Waves"
description = "Silky procedural northern lights flowing across a deep starfield with interactive luminous ripples."
author = "Rookery Sandbox"
version = "1.0.0"
archetype = "web_canvas"
tags = ["aurora", "borealis", "sky", "stars", "canvas"]

[theme]
tagline = "Borealis Sky Observatory"
banner_title = "Polar Magnetosphere Telemetry"
icon = "shooting-star"
ornament = "star-four"
bg = "#061621"
card = "rgba(11, 34, 50, 0.92)"
border_outer = "#0d9488"
accent = "#2dd4bf"
accent_secondary = "#a78bfa"
crest_gradient = ["#14b8a6", "#8b5cf6"]

[[controls]]
kind = "stat"
id = "palette"
label = "Spectrum"
default_val = "Emerald Borealis"
icon = "palette"

[[controls]]
kind = "stat"
id = "meteors"
label = "Meteors Seen"
default_val = "0"
icon = "shooting-star"

[[controls]]
kind = "slider"
id = "wave_speed"
label = "Solar Wind Speed"
min = 0.2
max = 3.0
step = 0.2
default_val = 1.0
unit = "x"

[[controls]]
kind = "button"
id = "burst"
label = "Stellar Burst"
icon = "sparkle"
tooltip = "Emits an explosion of glowing stellar sparks"

[[controls]]
kind = "button"
id = "cycle_aurora"
label = "Cycle Palette"
icon = "palette"
tooltip = "Switches between Emerald Borealis, Amethyst Twilight, Solar Flare, and Arctic Cyan palettes"

[[controls]]
kind = "button"
id = "shooting_star"
label = "Shooting Star"
icon = "shooting-star"
tooltip = "Streaks a brilliant meteor across the night sky"

[budgets]
target_fps = 60
max_cpu_ms = 1.5
max_rss_mb = 100.0

