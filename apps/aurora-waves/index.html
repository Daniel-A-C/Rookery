<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurora Waves</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #04050a;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: default;
    }
    body.interactive::after {
      content: "";
      position: fixed;
      inset: 0;
      border: 2px solid rgba(13, 148, 136, 0.85);
      box-shadow: inset 0 0 8px rgba(13, 148, 136, 0.25);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    // Display sizing with Retina / HiDPI support
    let dpr = window.devicePixelRatio || 1;
    let width = window.innerWidth;
    let height = window.innerHeight;

    function resize() {
      dpr = window.devicePixelRatio || 1;
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      initStars();
    }
    window.addEventListener('resize', resize);

    // Color palettes for the aurora ribbons
    const PALETTES = [
      {
        name: 'Emerald Borealis',
        topRgb: [0, 255, 135],
        midRgb: [96, 239, 255],
        bottomRgb: [110, 72, 170],
        glowRgb: [0, 255, 135],
      },
      {
        name: 'Amethyst Twilight',
        topRgb: [196, 113, 237],
        midRgb: [246, 79, 89],
        bottomRgb: [18, 194, 233],
        glowRgb: [196, 113, 237],
      },
      {
        name: 'Solar Flare',
        topRgb: [255, 210, 0],
        midRgb: [247, 151, 30],
        bottomRgb: [235, 87, 87],
        glowRgb: [255, 210, 0],
      },
      {
        name: 'Arctic Cyan',
        topRgb: [0, 198, 255],
        midRgb: [0, 114, 255],
        bottomRgb: [142, 45, 226],
        glowRgb: [0, 198, 255],
      }
    ];

    let currentPaletteIdx = 0;
    let colorPhase = 0.0;
    let wavePhase = 0.0;
    let waveSpeedMult = 1.0;
    let colorSpeedMult = 0.5;
    let meteorsSeen = 0;

    const STORAGE_KEY = 'rookery_aurora_settings';

    function applySettings(data) {
      if (!data || typeof data !== 'object') return;
      const ws = data.wave_speed ?? data.waveSpeed;
      if (typeof ws === 'number' && !Number.isNaN(ws) && ws > 0) {
        waveSpeedMult = ws;
      } else if (typeof ws === 'string') {
        const parsed = parseFloat(ws);
        if (!Number.isNaN(parsed) && parsed > 0) waveSpeedMult = parsed;
      }

      const cs = data.color_speed ?? data.colorSpeed;
      if (typeof cs === 'number' && !Number.isNaN(cs) && cs >= 0) {
        colorSpeedMult = cs;
      } else if (typeof cs === 'string') {
        const parsed = parseFloat(cs);
        if (!Number.isNaN(parsed) && parsed >= 0) colorSpeedMult = parsed;
      }
    }

    function persistSettings() {
      const data = {
        wave_speed: waveSpeedMult,
        color_speed: colorSpeedMult,
      };
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (e) {}
      if (window.Rookery && typeof window.Rookery.saveState === 'function') {
        window.Rookery.saveState(data);
      }
    }

    // 1. Synchronously restore from host-injected initial controls
    if (window.__ROOKERY_INITIAL_CONTROLS__) {
      applySettings(window.__ROOKERY_INITIAL_CONTROLS__);
    }

    // 2. Synchronously restore from localStorage (for immediate apply before 1st frame)
    try {
      const cached = localStorage.getItem(STORAGE_KEY);
      if (cached) {
        applySettings(JSON.parse(cached));
      }
    } catch (e) {}

    // 3. Asynchronously restore / sync from sandboxed Rookery state backend
    async function restorePersistedState() {
      if (window.Rookery && typeof window.Rookery.loadState === 'function') {
        try {
          const state = await window.Rookery.loadState();
          if (state) {
            applySettings(state);
          }
        } catch (e) {}
      }
    }
    restorePersistedState();

    function lerpRgb(a, b, t) {
      return [
        Math.round(a[0] + (b[0] - a[0]) * t),
        Math.round(a[1] + (b[1] - a[1]) * t),
        Math.round(a[2] + (b[2] - a[2]) * t),
      ];
    }

    function rgbToHex(rgb) {
      return (
        '#' +
        rgb
          .map((v) => Math.max(0, Math.min(255, v)).toString(16).padStart(2, '0'))
          .join('')
      );
    }

    function computeBlendedPalette(phase) {
      const len = PALETTES.length;
      const wrapped = ((phase % len) + len) % len;
      const idx0 = Math.floor(wrapped);
      const idx1 = (idx0 + 1) % len;
      const frac = wrapped - idx0;
      const smooth = frac * frac * (3 - 2 * frac);

      const p0 = PALETTES[idx0];
      const p1 = PALETTES[idx1];
      const top = lerpRgb(p0.topRgb, p1.topRgb, smooth);
      const mid = lerpRgb(p0.midRgb, p1.midRgb, smooth);
      const bottom = lerpRgb(p0.bottomRgb, p1.bottomRgb, smooth);
      const glow = lerpRgb(p0.glowRgb, p1.glowRgb, smooth);
      const nearestIdx = Math.round(wrapped) % len;

      return {
        nearestIdx,
        name: PALETTES[nearestIdx].name,
        top: `rgba(${top[0]}, ${top[1]}, ${top[2]}, `,
        mid: `rgba(${mid[0]}, ${mid[1]}, ${mid[2]}, `,
        bottom: `rgba(${bottom[0]}, ${bottom[1]}, ${bottom[2]}, `,
        glow: rgbToHex(glow),
      };
    }

    let activePalette = computeBlendedPalette(0);

    function syncTelemetry() {
      if (window.Rookery && typeof window.Rookery.setStats === 'function') {
        window.Rookery.setStats({
          palette: activePalette.name,
          meteors: String(meteorsSeen),
        });
      }
    }

    // Starfield Simulation
    let stars = [];
    function initStars() {
      stars = [];
      const count = Math.floor((width * height) / 3200);
      for (let i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height * 0.75,
          radius: Math.random() * 1.4 + 0.3,
          baseAlpha: Math.random() * 0.7 + 0.2,
          twinkleSpeed: Math.random() * 0.03 + 0.005,
          twinklePhase: Math.random() * Math.PI * 2,
        });
      }
    }

    // Spark Particles (emitted by clicks or stellar burst)
    let sparks = [];
    function spawnSparks(x, y, count = 40, maxSpeed = 4) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = (Math.random() * 0.8 + 0.2) * maxSpeed;
        sparks.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 0.5,
          life: 1.0,
          decay: Math.random() * 0.02 + 0.01,
          size: Math.random() * 2.5 + 1.0,
          color: activePalette.glow,
        });
      }
    }

    // Shooting Stars (meteors)
    let meteors = [];
    function spawnMeteor() {
      meteorsSeen += 1;
      syncTelemetry();
      const startX = Math.random() * width * 0.7 + width * 0.15;
      const startY = Math.random() * height * 0.25;
      const angle = (Math.PI / 4) + (Math.random() - 0.5) * 0.3;
      const speed = Math.random() * 8 + 12;
      meteors.push({
        x: startX,
        y: startY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        length: Math.random() * 120 + 80,
        alpha: 1.0,
        decay: 0.02,
      });
    }

    // Ripple disturbances caused by mouse / direct mode
    let ripples = [];
    function addRipple(x, y) {
      ripples.push({
        x,
        y,
        radius: 0,
        maxRadius: Math.max(width, height) * 0.35,
        alpha: 1.0,
      });
    }

    // Pointer & Direct Interaction State
    let pointer = { x: -1000, y: -1000, down: false };
    let isDirectMode = false;

    window.addEventListener('pointermove', (e) => {
      pointer.x = e.clientX;
      pointer.y = e.clientY;
      if (pointer.down) {
        if (Math.random() < 0.35) {
          spawnSparks(e.clientX, e.clientY, 3, 2);
        }
      }
    });

    window.addEventListener('pointerdown', (e) => {
      pointer.down = true;
      pointer.x = e.clientX;
      pointer.y = e.clientY;
      spawnSparks(e.clientX, e.clientY, 30, 5);
      addRipple(e.clientX, e.clientY);
    });

    window.addEventListener('pointerup', () => {
      pointer.down = false;
    });

    // Handle Rookery Popover Actions
    window.addEventListener('rookery-action', (e) => {
      const action = e.detail?.action;
      if (action === 'burst') {
        const cx = width * 0.5 + (Math.random() - 0.5) * 200;
        const cy = height * 0.45 + (Math.random() - 0.5) * 100;
        spawnSparks(cx, cy, 140, 8);
        addRipple(cx, cy);
      } else if (action === 'cycle_aurora') {
        colorPhase = (Math.floor(colorPhase) + 1) % PALETTES.length;
        activePalette = computeBlendedPalette(colorPhase);
        currentPaletteIdx = activePalette.nearestIdx;
        spawnSparks(width * 0.5, height * 0.3, 40, 3);
        syncTelemetry();
      } else if (action === 'shooting_star') {
        spawnMeteor();
      }
    });

    // Handle Rookery Popover Slider & Select Controls
    window.addEventListener('rookery-control', (e) => {
      const { id, value } = e.detail || {};
      let changed = false;
      if (id === 'wave_speed') {
        const parsed = parseFloat(value);
        if (!Number.isNaN(parsed) && parsed > 0) {
          waveSpeedMult = parsed;
          changed = true;
        }
      } else if (id === 'color_speed') {
        const parsed = parseFloat(value);
        if (!Number.isNaN(parsed) && parsed >= 0) {
          colorSpeedMult = parsed;
          changed = true;
        }
      }
      if (changed) {
        persistSettings();
      }
    });

    // Handle Direct Interaction Mode Toggling
    window.addEventListener('rookery-interactive', (e) => {
      isDirectMode = !!e.detail?.interactive;
      document.body.classList.toggle('interactive', isDirectMode);
      if (isDirectMode) {
        spawnSparks(width * 0.5, height * 0.5, 25, 3);
      }
    });

    // Periodic auto shooting star every 20-35 seconds
    setInterval(() => {
      if (Math.random() < 0.6) {
        spawnMeteor();
      }
    }, 22000);

    // Multi-Layer Aurora Ribbons Wave Equation
    function getWaveY(x, layerIdx, time) {
      const t = wavePhase;
      let y = Math.sin(x * 0.0022 + t * 1.2 + layerIdx * 1.5) * 60;
      y += Math.sin(x * 0.0045 - t * 0.8 + layerIdx * 2.2) * 35;
      y += Math.cos(x * 0.0011 + t * 0.4) * 50;

      // Mouse influence
      const dx = x - pointer.x;
      const dy = (height * 0.45) - pointer.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 320) {
        const force = (1 - dist / 320) * 45;
        y += Math.sin(dist * 0.05 - time * 0.008) * force;
      }

      // Ripple influence
      for (const r of ripples) {
        const d = Math.abs(x - r.x);
        if (Math.abs(d - r.radius) < 60) {
          y += Math.cos((d - r.radius) * 0.1) * (15 * r.alpha);
        }
      }

      return y;
    }

    // Main Animation Loop (60 FPS)
    let lastTime = performance.now();
    resize();

    function render(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      wavePhase += dt * 0.6 * waveSpeedMult;
      if (colorSpeedMult > 0) {
        colorPhase = (colorPhase + dt * 0.12 * colorSpeedMult) % PALETTES.length;
        activePalette = computeBlendedPalette(colorPhase);
        if (activePalette.nearestIdx !== currentPaletteIdx) {
          currentPaletteIdx = activePalette.nearestIdx;
          syncTelemetry();
        }
      }

      // Clear with subtle nocturnal deep gradient
      const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
      bgGrad.addColorStop(0, '#030408');
      bgGrad.addColorStop(0.55, '#070b16');
      bgGrad.addColorStop(1, '#090818');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, width, height);

      // 1. Draw Starfield
      for (const star of stars) {
        star.twinklePhase += star.twinkleSpeed;
        const alpha = star.baseAlpha + Math.sin(star.twinklePhase) * 0.25;
        ctx.fillStyle = `rgba(220, 235, 255, ${Math.max(0.1, alpha)})`;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fill();
      }

      // 2. Draw Meteors
      for (let i = meteors.length - 1; i >= 0; i--) {
        const m = meteors[i];
        m.x += m.vx;
        m.y += m.vy;
        m.alpha -= m.decay;

        if (m.alpha <= 0 || m.x > width + 200 || m.y > height + 200) {
          meteors.splice(i, 1);
          continue;
        }

        const grad = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * 6, m.y - m.vy * 6);
        grad.addColorStop(0, `rgba(255, 255, 255, ${m.alpha})`);
        grad.addColorStop(0.4, `${activePalette.top}${m.alpha * 0.7})`);
        grad.addColorStop(1, 'rgba(255, 255, 255, 0)');

        ctx.strokeStyle = grad;
        ctx.lineWidth = 2.0;
        ctx.beginPath();
        ctx.moveTo(m.x, m.y);
        ctx.lineTo(m.x - m.vx * 6, m.y - m.vy * 6);
        ctx.stroke();
      }

      // 3. Draw Aurora Ribbons with Screen Glow Compositing
      ctx.save();
      ctx.globalCompositeOperation = 'screen';

      const ribbonCount = 4;
      const baseHeights = [
        height * 0.38,
        height * 0.44,
        height * 0.50,
        height * 0.58,
      ];
      const stepX = 14;

      for (let r = 0; r < ribbonCount; r++) {
        const baseY = baseHeights[r];
        const curtainHeight = height * 0.32;

        ctx.beginPath();
        ctx.moveTo(0, height);

        for (let x = 0; x <= width + stepX; x += stepX) {
          const wave = getWaveY(x, r, now);
          const y = baseY + wave;
          if (x === 0) {
            ctx.lineTo(x, y);
          } else {
            ctx.lineTo(x, y);
          }
        }

        ctx.lineTo(width, height);
        ctx.closePath();

        const ribbonGrad = ctx.createLinearGradient(0, baseY - 80, 0, baseY + curtainHeight);
        ribbonGrad.addColorStop(0, `${activePalette.top}0.0)`);
        ribbonGrad.addColorStop(0.2, `${activePalette.top}0.38)`);
        ribbonGrad.addColorStop(0.55, `${activePalette.mid}0.28)`);
        ribbonGrad.addColorStop(0.85, `${activePalette.bottom}0.18)`);
        ribbonGrad.addColorStop(1.0, `${activePalette.bottom}0.0)`);

        ctx.fillStyle = ribbonGrad;
        ctx.fill();
      }

      ctx.restore();

      // 4. Update and Draw Ripples
      for (let i = ripples.length - 1; i >= 0; i--) {
        const rip = ripples[i];
        rip.radius += 140 * dt;
        rip.alpha -= 0.6 * dt;
        if (rip.alpha <= 0 || rip.radius > rip.maxRadius) {
          ripples.splice(i, 1);
          continue;
        }

        ctx.strokeStyle = `${activePalette.top}${rip.alpha * 0.35})`;
        ctx.lineWidth = 2.0;
        ctx.beginPath();
        ctx.arc(rip.x, rip.y, rip.radius, 0, Math.PI * 2);
        ctx.stroke();
      }

      // 5. Update and Draw Sparks
      for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        s.x += s.vx;
        s.y += s.vy;
        s.vy += 0.8 * dt; // gentle gravity
        s.vx *= 0.98;
        s.life -= s.decay;

        if (s.life <= 0) {
          sparks.splice(i, 1);
          continue;
        }

        ctx.fillStyle = `${s.color}${Math.floor(s.life * 255).toString(16).padStart(2, '0')}`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size * s.life, 0, Math.PI * 2);
        ctx.fill();
      }

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
