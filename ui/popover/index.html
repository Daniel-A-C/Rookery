<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rookery</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="popover">
      <header class="header">
        <div class="brand">
          <span class="bird-glyph" aria-hidden="true">◆</span>
          <div>
            <h1>Rookery</h1>
            <p class="subtitle">The Living ASCII Rookery</p>
          </div>
        </div>
        <span id="power-badge" class="badge">AC</span>
      </header>

      <section class="card rookery-card">
        <div class="section-title">The Living World</div>
        <div class="stats-grid">
          <div class="stat-box">
            <span class="stat-label">Tree Age</span>
            <span id="stat-age" class="stat-value">0h 00m</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">Branches</span>
            <span id="stat-branches" class="stat-value">0</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">Foliage Buds</span>
            <span id="stat-foliage" class="stat-value">0</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">Flock in Sky</span>
            <span id="stat-birds" class="stat-value">4 birds</span>
          </div>
        </div>
        <div class="rookery-actions">
          <button id="btn-feed" class="btn small" type="button" title="Place snacks on branches to entice birds">
            🌾 Feed Birds
          </button>
          <button id="btn-prune" class="btn small" type="button" title="Gently prune branches to shape the canopy">
            ✂️ Prune
          </button>
          <button id="btn-plant" class="btn small" type="button" title="Drop a seed to grow a new sapling">
            🌱 Plant Sapling
          </button>
        </div>
        <div id="seed-notification" class="notification-text" hidden></div>
      </section>

      <section class="card share-card">
        <div class="section-title">Share &amp; Capture</div>
        <div class="share-actions">
          <button id="btn-snapshot" class="btn small" type="button" title="Capture clean desktop snapshot PNG">
            📸 Snapshot
          </button>
          <button id="btn-record-loop" class="btn small" type="button" title="Record 5-second clean GIF loop">
            🎞️ Record GIF
          </button>
          <button id="btn-copy-seed" class="btn small" type="button" title="Copy shareable World Seed URI">
            🌱 Copy Seed
          </button>
          <button id="btn-copy-state" class="btn small" type="button" title="Copy full World State snapshot">
            📦 Copy State
          </button>
        </div>
        <div class="import-group">
          <input
            id="input-import-world"
            type="text"
            class="import-input"
            placeholder="Paste seed or state URI…"
            spellcheck="false"
          />
          <button id="btn-import-world" class="btn small primary" type="button">
            Import
          </button>
        </div>
        <div id="share-notification" class="notification-text" hidden></div>
      </section>

      <section class="card actions-row">
        <button id="btn-interactive" class="btn primary" type="button">
          <span id="lbl-interactive">Interact on Desktop</span>
          <kbd id="kbd-hotkey">⌘⌥⇧R</kbd>
        </button>
        <button id="btn-pause" class="btn secondary" type="button">
          Pause
        </button>
      </section>

      <section class="card">
        <div class="section-title">Displays</div>
        <ul id="displays-list" class="displays-list">
          <li class="empty">Detecting displays…</li>
        </ul>
      </section>

      <section class="card">
        <div class="section-title">Performance &amp; Controls</div>

        <label class="control-row" for="slider-passive">
          <span>Passive FPS Cap</span>
          <strong id="val-passive">24 fps</strong>
        </label>
        <input
          id="slider-passive"
          type="range"
          min="15"
          max="30"
          step="1"
          value="24"
        />

        <label class="control-row" for="slider-lowpower">
          <span>Low-Power FPS</span>
          <strong id="val-lowpower">12 fps</strong>
        </label>
        <input
          id="slider-lowpower"
          type="range"
          min="5"
          max="15"
          step="1"
          value="12"
        />

        <label class="checkbox-row">
          <input id="chk-battery" type="checkbox" />
          <span>Pause simulation on battery power</span>
        </label>

        <div class="hotkey-row">
          <span>Interaction Hotkey</span>
          <button id="btn-record-hotkey" class="hotkey-btn" type="button">
            CommandOrControl+Alt+Shift+R
          </button>
        </div>
        <p id="hotkey-error" class="error-msg" hidden></p>
      </section>

      <footer class="footer">
        <span class="version">v0.1.0 · MIT</span>
        <button id="btn-quit" class="quit-btn" type="button">
          Quit Rookery
        </button>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
